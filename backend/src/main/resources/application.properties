spring.application.name=thrainax-shop
server.port=8080
server.servlet.context-path=/

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/thrainax_shop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=change-this-to-a-long-random-secret-at-least-32-bytes-long
app.jwt.expiration-ms=86400000

# CORS (React dev server / preview)
app.cors.allowed-origins=http://localhost:5173,http://localhost:8080,http://localhost:3000
